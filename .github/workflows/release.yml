name: Release

# Tag-triggered publish to PyPI via Trusted Publishing (OIDC) — no API token stored.
# Both projects must have a trusted publisher configured on PyPI pointing at this
# repo, workflow file `release.yml`, and environment `pypi`.
#
# workflow_dispatch runs the build+test path only (publish jobs are tag-gated), so
# the pipeline can be exercised without live-firing at an immutable registry.
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      # The installer must start under Python 3.8; tests/test_installer_live.py finds this
      # interpreter and skips when it is absent, so the download lives here, not in the test.
      - name: Install CPython 3.8 for the installer test
        run: uv python install 3.8

      # The tag is what users get; a mismatch would publish a version nobody asked for.
      # A release-candidate tag (v0.20.0rc1) matches an rc version here, then only
      # builds and tests: the publish jobs skip it, so testers install from the tag.
      - name: Tag must match both package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in snaplii-cli/pyproject.toml mcp-server/pyproject.toml; do
            v=$(python3 -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1],'rb'))['project']['version'])" "$f")
            echo "$f -> $v"
            [ "$v" = "$tag" ] || { echo "::error file=$f::version is $v but the tag is $tag"; exit 1; }
          done

      # Deps come from the packages themselves, so CI can't drift from what ships
      # (the mcp<2 ceiling lives in mcp-server/pyproject.toml and nowhere else).
      # Installing ./mcp-server also exercises its packaging and its snaplii-cli floor.
      # uv prefers the interpreters it manages, and the only one is the 3.8 above,
      # so the tests and the build name a supported Python explicitly.
      - name: Test
        run: uv run --python 3.12 --with "./snaplii-cli[dev]" --with ./mcp-server pytest tests -q

      - name: Build
        run: |
          uv build --python 3.12 snaplii-cli --out-dir dist/cli
          uv build --python 3.12 mcp-server  --out-dir dist/mcp

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # snaplii-mcp requires snaplii-cli>=<same version>, so the CLI lands first.
  publish-cli:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # PyPI is immutable: skip-existing keeps a retry after a partial upload
      # from dying on "File already exists" and burning the version number.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/cli/
          skip-existing: true

  publish-mcp:
    needs: publish-cli
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/mcp/
          skip-existing: true
