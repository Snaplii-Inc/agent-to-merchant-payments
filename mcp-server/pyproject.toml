[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snaplii-mcp"
version = "0.14.1"
description = "MCP server for Snaplii A2M payments — browse, purchase gift cards, and pay bills"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Snaplii Inc", email = "charles.zhang@snaplii.com"}]
keywords = ["snaplii", "mcp", "gift-cards", "bill-pay", "ai-agent", "payments"]
dependencies = [
    "mcp>=1.0",
    "snaplii-cli>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/Snaplii-Inc/agent-to-merchant-payments"
Repository = "https://github.com/Snaplii-Inc/agent-to-merchant-payments"

[project.scripts]
snaplii-mcp = "server:main_sync"

[tool.hatch.build.targets.wheel]
packages = ["."]
