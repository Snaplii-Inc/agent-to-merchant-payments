[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snaplii-cli"
version = "0.13.3"
description = "Browse, purchase gift cards, and pay bills through Snaplii — safe payments for AI agents"
readme = {file = "../README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Snaplii Inc", email = "charles.zhang@snaplii.com"}]
keywords = ["snaplii", "gift-cards", "ai-agent", "payments", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "httpcore>=1.0,<2",
    "keyring>=25.0",
]

[project.urls]
Homepage = "https://github.com/Snaplii-Inc/agent-to-merchant-payments"
Repository = "https://github.com/Snaplii-Inc/agent-to-merchant-payments"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-httpx>=0.35,<1",
]

[project.scripts]
snaplii = "snaplii.cli:_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/snaplii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
